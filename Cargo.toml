[package]
name = "shr-lux"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Source-aware lighting for live bands on Raspberry Pi"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.189"
hound = "3.5.1"
signal-hook = "0.3.18"
crossterm = "0.29"
ratatui = "0.30.2"
rusb = { version = "0.9.4", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12.1"

[profile.release]
lto = "thin"
codegen-units = 1
